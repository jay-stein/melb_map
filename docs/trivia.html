<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suburb Detective — Melbourne Suburb Quirks</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<div class="game game-wide" id="trivia-app">
  <a class="back-link" href="index.html">← Map</a>
  <h1>🔍 Suburb Detective</h1>
  <p class="sub">Can you name the suburb from just a few clues?</p>

  <!-- region select -->
  <div id="region-screen">
    <p class="region-prompt">First, where should the mystery suburbs come from? Or test your city knowledge.</p>
    <button class="region-btn city-card" id="city-mode-btn">
      <span class="region-name">🏙️ City Facts</span>
      <span class="region-count">true or false quiz · 10 questions</span>
    </button>
    <div class="region-grid" id="region-btns"></div>
  </div>

  <!-- game screen (hidden initially) -->
  <div id="game-screen" style="display:none">
    <div id="trivia-map" style="height:520px; margin-bottom:10px; border-radius:8px; border:1px solid #E0E0E0; overflow:hidden;"></div>
    <p class="round-label" id="round-label"></p>
    <div id="clues-area"></div>
    <div id="guess-area">
      <p class="tiles-label">Pick a suburb:</p>
      <div class="tiles-grid" id="tiles"></div>
      <button id="reveal-btn" class="reveal-btn">Show another clue</button>
      <p class="clue-cost" id="clue-cost"></p>
    </div>
    <div id="feedback"></div>
  </div>

  <!-- city facts mode (hidden initially) -->
  <div id="city-screen" style="display:none">
    <p class="round-label" id="city-round-label"></p>
    <div class="city-fact-card" id="city-fact"></div>
    <div class="tf-row">
      <button id="tf-true" class="tf-btn tf-true">TRUE</button>
      <button id="tf-false" class="tf-btn tf-false">FALSE</button>
    </div>
    <div class="city-progress" id="city-progress"></div>
    <div id="city-feedback"></div>
  </div>

  <!-- results screen (hidden initially) -->
  <div id="results-screen" style="display:none">
    <h2 id="trophy"></h2>
    <p id="score-summary"></p>
    <div id="round-results"></div>
    <pre id="share-grid" class="grid-pre"></pre>
    <div class="result-actions">
      <button id="share-btn" class="play-again">Share 📋</button>
      <button id="play-again-btn" class="play-again">Play again</button>
    </div>
  </div>
</div>
<script src="trivia.js"></script>
</body>
</html>
