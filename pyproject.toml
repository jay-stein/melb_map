[project]
name = "melb-map"
version = "0.1.0"
description = "Interactive map of 133 Melbourne suburbs with quirky character tags scraped from r/melbourne and summarized by DeepSeek."
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "shapely>=2.0.0",
    "pyogrio>=0.10.0",
    "replicate>=1.0.4",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

# Force patched versions of transitive deps with known CVEs
# (idna, soupsieve, setuptools; pillow was dropped as an unused direct dep).
[tool.uv]
override-dependencies = [
    "idna>=3.15",
    "soupsieve>=2.8.4",
    "setuptools>=83.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape"]
