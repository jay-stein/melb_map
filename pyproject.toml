[project]
name = "melb-map"
version = "0.1.0"
description = "Interactive map of inner/middle Melbourne suburbs with quirky character tags scraped from r/melbourne and summarized by Claude."
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "shapely>=2.0.0",
    "pyogrio>=0.10.0",
    "pillow>=11.0.0",
    "replicate>=1.0.4",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrape"]
